services:
  postgres:
    image: postgres:16-alpine
    container_name: clinora_postgres
    environment:
      POSTGRES_USER: clinora
      POSTGRES_PASSWORD: clinora
      POSTGRES_DB: clinora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinora -d clinora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
